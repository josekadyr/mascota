
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Mascotas</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <h1>Formulario de Registro de Mascotas</h1>
  </header>

  <main>
    <section class="seccion">
      <form class="formulario" action="#" method="post">
        <h2><i class="fas fa-paw"></i> Registra a tu mascota</h2>

        <label for="nombre">Nombre de la mascota:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="especie">Especie:</label>
        <select id="especie" name="especie">
          <option value="">Selecciona...</option>
          <option value="perro">Perro</option>
          <option value="gato">Gato</option>
          <option value="ave">Ave</option>
          <option value="roedor">Roedor</option>
          <option value="otro">Otro</option>
        </select>

        <label for="raza">Raza:</label>
        <input type="text" id="raza" name="raza">

        <label for="genero">Género:</label>
        <select id="genero" name="genero">
          <option value="">Selecciona...</option>
          <option value="macho">Macho</option>
          <option value="hembra">Hembra</option>
        </select>

        <label for="edad">Edad (en años):</label>
        <input type="number" id="edad" name="edad" min="0" max="50">

        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" name="peso" step="0.1">

        <label for="vacunas">Vacunas aplicadas:</label>
        <textarea id="vacunas" name="vacunas" rows="2" placeholder="Ej: Rabia, Parvovirus, Moquillo..."></textarea>

        <label for="observaciones">Observaciones adicionales:</label>
        <textarea id="observaciones" name="observaciones" rows="4"></textarea>

        <label for="foto">Foto de la mascota:</label>
        <input type="file" id="foto" name="foto" accept="image/*">

        <button type="submit"><i class="fas fa-check-circle"></i> Registrar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Registro de Mascotas</p>
  </footer>
</body>
</html>
